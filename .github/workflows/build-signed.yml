name: Build · Signed

run-name: >-
  ${{ github.event_name == 'push'
      && format('Signed build · {0}', github.ref_name)
      || format('Signed build · {0} · {1}', github.ref_name, inputs.version_suffix || 'no suffix') }}

# Packaging entry point for untagged builds. Produces the same signed, notarized,
# release-equivalent artifacts a tag would ship — on one run page, for all four
# platforms — without creating a GitHub Release or touching gh-pages.
#
# A tester build is a dispatch on development with version_suffix "<next version>-rcN"
# (0.8.1-rc1, 0.8.1-rc2, … then tag v0.8.1). The suffix is required on development and
# checked below; other branches may leave it blank.
#
# Automatic on push to main; on demand for any branch via workflow_dispatch.
# The actual per-platform logic lives in the _build-*.yml reusable workflows so
# there is exactly one definition of it, shared with release.yml.

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Tester build: "<next version>-rcN", e.g. 0.8.1-rc1. Required on development; optional elsewhere.'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Derive version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Derive version
        id: derive
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Slashes are legal in ref names but not in filenames.
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${BRANCH}-${SHORT_SHA}"
          SUFFIX="${{ inputs.version_suffix }}"

          # WHY refuse here: a dispatch on development is a tester build, and its suffix is what
          # testers, the side panel (VersionText::panelLabel) and the run list identify it by.
          # Without one the package is named exactly like the unsigned ci-packaging.yml build.
          RC_RE='^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$'
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" = "development" ] && [ -z "$SUFFIX" ]; then
            echo "::error::A tester build on development needs version_suffix \"<next version>-rcN\", e.g. 0.8.1-rc1."
            exit 1
          fi
          if [ -n "$SUFFIX" ] && ! [[ "$SUFFIX" =~ $RC_RE ]]; then
            echo "::error::version_suffix \"$SUFFIX\" is not \"<major>.<minor>.<patch>-rcN\", e.g. 0.8.1-rc1."
            exit 1
          fi
          if [ -n "$SUFFIX" ]; then
            VERSION="${VERSION}-${SUFFIX}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Derived version: $VERSION"

  macos:
    needs: version
    uses: ./.github/workflows/_build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 90
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/_build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 90
    secrets: inherit

  raspberry-pi:
    needs: version
    uses: ./.github/workflows/_build-pi.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 90
    secrets: inherit

  flatpak:
    needs: version
    uses: ./.github/workflows/_build-flatpak.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 90
    secrets: inherit

  summary:
    name: Artifact summary
    needs: [version, macos, windows, raspberry-pi, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "### QK4 build \`${{ needs.version.outputs.version }}\`"
            echo
            echo "| Platform | Artifact |"
            echo "|---|---|"
            echo "| macOS | \`${{ needs.macos.outputs.artifact-name }}\` |"
            echo "| Windows | \`${{ needs.windows.outputs.artifact-name }}\` |"
            echo "| Raspberry Pi | \`${{ needs.raspberry-pi.outputs.artifact-name }}\` |"
            echo "| Linux x86_64 | \`${{ needs.flatpak.outputs.artifact-name }}\` |"
            echo
            echo "Signed and notarized; equivalent to what a tag would ship. Artifacts kept 90 days."
            echo "No GitHub Release created, no gh-pages change."
            echo
            echo "Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
