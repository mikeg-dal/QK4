name: Scheduled · Sanitizers

# Weekly ThreadSanitizer pass over the test suite. TSan cannot coexist with
# ASAN, so it gets its own scheduled run; the ASAN/UBSAN gate already runs on
# every push in ci-checks.yml and is deliberately NOT duplicated here.
#
# Failures become a tracked GitHub issue instead of an unread red run: one open
# tracking issue per sanitizer kind (found by label), with a comment appended
# per failing run — no duplicate issues.
#
# Qt is built here, with TSan, rather than installed from apt. A distro Qt is not
# instrumented, so TSan cannot see Qt's own locking and reports every cross-thread
# queued call as a data race — #172, reproduced with a Qt-only program. See
# scripts/build-qtbase-tsan.sh. Only qtbase is built (the tests need nothing else)
# and it is cached, so only the first run after the script changes pays for it.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sanitize:
    # See ci-codeql.yml — keeps scheduled runs from charging forkers.
    if: github.repository == 'mikeg-dal/QK4'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # A cold cache builds qtbase with TSan first; a warm one restores it in seconds.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tsan
            # TSan needs optimized-but-symbolized builds; flags go through the
            # environment so every standalone test executable gets them.
            cmake_args: -DCMAKE_BUILD_TYPE=RelWithDebInfo
            cxxflags: '-fsanitize=thread -g -fno-omit-frame-pointer'
            ldflags: '-fsanitize=thread'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config perl python3 \
            libfontconfig1-dev libfreetype-dev \
            libopus-dev libhidapi-dev libusb-1.0-0-dev libssl-dev libudev-dev

      # WHY the compiler version is in the key: Qt and the tests must share one TSan runtime. When the
      # runner image moves to a new compiler, a Qt cached by the old one must be rebuilt, not reused.
      # (${{ env.ImageOS }} cannot do this: the env context sees only workflow-defined variables.)
      - name: Compute qtbase cache key
        id: qt-key
        run: echo "compiler=$(c++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore TSan-instrumented qtbase
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/qt-tsan
          key: qtbase-tsan-${{ runner.os }}-gcc${{ steps.qt-key.outputs.compiler }}-${{ hashFiles('scripts/build-qtbase-tsan.sh') }}

      - name: Build TSan-instrumented qtbase
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: scripts/build-qtbase-tsan.sh "$HOME/qt-tsan"

      - name: Configure CMake
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: cmake -B build-san -G Ninja ${{ matrix.cmake_args }} -DQK4_TESTS_ONLY=ON -DCMAKE_PREFIX_PATH="$HOME/qt-tsan"

      - name: Build instrumented tests
        run: cmake --build build-san --target qk4_tests

      - name: Run instrumented tests
        id: run
        shell: bash
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        # Capture the exit code instead of failing here so the reporting steps
        # below always run; the final step restores the red status.
        run: |
          set +e
          ctest --test-dir build-san --output-on-failure 2>&1 | tee sanitizer.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract failure report
        if: steps.run.outputs.exit_code != '0'
        id: report
        shell: bash
        # 45KB cap keeps the report under the issue-body size limit.
        run: |
          grep -A 80 "SUMMARY: " sanitizer.log | head -c 45000 > report.txt || true
          if [ ! -s report.txt ]; then
            tail -c 45000 sanitizer.log > report.txt
          fi
          FIRST_SUMMARY=$(grep -m1 "SUMMARY: " sanitizer.log || echo "no-summary-line")
          echo "fingerprint=$(printf '%s' "$FIRST_SUMMARY" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Upload full log
        if: steps.run.outputs.exit_code != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sanitizer-log-${{ matrix.name }}-${{ github.run_id }}
          path: sanitizer.log
          retention-days: 30

      - name: Report to tracking issue
        if: steps.run.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SANITIZER_KIND: ${{ matrix.name }}
          FINGERPRINT: ${{ steps.report.outputs.fingerprint }}
        with:
          script: |
            const fs = require('fs');
            const kind = process.env.SANITIZER_KIND;
            const fingerprint = process.env.FINGERPRINT;
            const report = fs.readFileSync('report.txt', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scheduled \`${kind}\` run failed.`,
              '',
              `- Run: ${runUrl}`,
              `- Failure fingerprint: \`${fingerprint}\` (first SUMMARY line; same fingerprint = same crash)`,
              '- Full log: 30-day artifact on the run linked above',
              '',
              '```',
              report,
              '```',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: `sanitizer,${kind}`,
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              core.info(`Appended to tracking issue #${issues[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[sanitizer] ${kind} failures in scheduled run`,
                labels: ['sanitizer', kind],
                body,
              });
              core.info(`Opened tracking issue #${issue.number}`);
            }

      - name: Fail the job on sanitizer findings
        if: steps.run.outputs.exit_code != '0'
        run: exit 1
