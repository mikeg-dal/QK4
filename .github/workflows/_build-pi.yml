name: _build-pi

# Reusable Raspberry Pi (ARM64) builder. Called by build.yml and release.yml;
# never triggered directly. All the real work lives in .github/scripts/build-pi.sh,
# which already takes the version string as $1 and stamps it via QK4_VERSION_FULL.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string stamped into the binary and the tarball filename'
        required: true
        type: string
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 14
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve artifact name
        id: names
        run: echo "artifact=QK4-raspberry-pi-${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Cache Pi build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /tmp/pi-apt-cache
            /tmp/pi-ccache
          key: pi-arm64-${{ hashFiles('.github/scripts/build-pi.sh') }}
          restore-keys: pi-arm64-

      - name: Cross-compile for ARM64 in Debian Trixie
        run: |
          mkdir -p /tmp/pi-apt-cache /tmp/pi-ccache
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /tmp/pi-apt-cache:/var/cache/apt/archives \
            -v /tmp/pi-ccache:/ccache \
            -e CCACHE_DIR=/ccache \
            -w /workspace \
            debian:trixie \
            bash /workspace/.github/scripts/build-pi.sh "${{ inputs.version }}"
          # Fix ownership so actions/cache can tar the files (Docker writes as root)
          sudo chown -R $(id -u):$(id -g) /tmp/pi-apt-cache /tmp/pi-ccache

      - name: Verify tarball contents
        run: |
          # WHY: inspect the packaged artifact, not the build tree. The Linux
          # analogue of the Windows TLS regression is a missing OpenSSL backend
          # plugin, which is invisible until you look inside the tarball.
          TARBALL="QK4-${{ inputs.version }}-raspberry-pi-arm64.tar.gz"
          FAIL=0
          for required in \
            "QK4/QK4" \
            "QK4/run.sh" \
            "QK4/lib/libssl.so.3" \
            "QK4/plugins/tls/libqopensslbackend.so" \
            "QK4/plugins/platforms"; do
            if ! tar tzf "$TARBALL" | grep -q "^${required}"; then
              echo "ERROR: missing from tarball: $required"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: QK4-${{ inputs.version }}-raspberry-pi-arm64.tar.gz
          retention-days: ${{ inputs.retention-days }}
