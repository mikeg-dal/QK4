name: CI · CodeQL

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} → {1}: {2}', github.event.pull_request.number, github.base_ref, github.event.pull_request.title)
      || github.event_name == 'push'
      && format('{0}: {1}', github.ref_name, github.event.head_commit.message)
      || format('{0} ({1})', github.ref_name, github.event_name) }}

# Static security/bug analysis of the C++ sources. Findings appear under
# Security -> Code scanning; nothing blocks merges. C++ analysis requires a
# full build, so doc-only changes are skipped and a weekly scheduled run
# guarantees coverage regardless of push activity.

on:
  push:
    branches: [main, development]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, development]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # WHY: forks inherit this workflow's schedule and burn the forker's free
    # Actions minutes running our security scans. A PR from a fork still runs in
    # this repo's context, so the guard only suppresses runs inside the fork.
    if: github.repository == 'mikeg-dal/QK4'
    name: Analyze C++
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev \
            libopus-dev libhidapi-dev libusb-1.0-0-dev libssl-dev libudev-dev libasound2-dev

      - name: Read Qt version
        # WHY: .github/qt-version is the one Qt version every runner uses (scripts/check-qt-version.sh).
        run: echo "QT_VERSION=$(tr -d '[:space:]' < .github/qt-version)" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          modules: 'qtmultimedia qtshadertools qtserialport'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        # WHY the app target only: CodeQL extracts every compile, and the ~80 test executables
        # recompile the app sources they test (324 compiles of 110 files), so building them
        # multiplied the extraction for code it had already seen; the test files themselves are
        # not what this scan is for. Serially the full build passed the 60-minute limit (46 min,
        # then two timeouts on 2026-11-01); with --parallel 4 it still took 31 min.
        # WHY 4: the runner's cores; a bare --parallel is an unlimited `make -j`, which ran a
        # runner out of memory (ci-checks.yml).
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target QK4 --parallel 4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: '/language:c-cpp'
