name: _build-flatpak

# Reusable Linux x86_64 (Flatpak) builder. Called by build.yml; never triggered
# directly. Flatpak is distro-agnostic — one bundle runs on Ubuntu, Fedora,
# Debian, Arch and the rest — so this is one artifact, not per-distro packaging.
#
# The manifest in flatpak/ is authored to stay usable for local development
# (`flatpak-builder build flatpak/io.github.mikeg_dal.QK4.json`), so it tracks
# the main branch. CI must not do that: an artifact attached to a release has to
# be the released commit. The jq step below rewrites the manifest in place for
# the build only, pinning the source commit and stamping the version.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string stamped into the binary and the bundle filename'
        required: true
        type: string
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 14
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      # flatpak-builder needs to create its own sandboxes.
      options: --privileged
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve artifact name
        id: names
        run: echo "artifact=QK4-linux-${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Pin manifest to this commit and stamp the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          MANIFEST=flatpak/io.github.mikeg_dal.QK4.json

          # WHY: left as-is the manifest clones the main branch at build time, so a
          # bundle attached to a tag could contain commits that are not in that tag.
          # The manifest already carries QK4_VERSION_FULL as a build env var with a
          # sensible local default, so CI only overrides its value — the build
          # command itself stays untouched and readable.
          jq --arg sha "$GITHUB_SHA" --arg ver "$VERSION" '
            (.modules[] | select(.name == "qk4") | .sources[] | select(.type == "git"))
              |= (del(.branch) + {commit: $sha})
            | (.modules[] | select(.name == "qk4") | .["build-options"].env.QK4_VERSION_FULL)
              = $ver
          ' "$MANIFEST" > manifest.pinned.json

          # Fail loudly rather than silently building an unpinned or unstamped bundle.
          jq -e --arg sha "$GITHUB_SHA" '
            (.modules[] | select(.name=="qk4") | .sources[] | select(.type=="git") | .commit) == $sha
          ' manifest.pinned.json > /dev/null || { echo "ERROR: source commit not pinned"; exit 1; }
          jq -e --arg ver "$VERSION" '
            (.modules[] | select(.name=="qk4") | .["build-options"].env.QK4_VERSION_FULL) == $ver
          ' manifest.pinned.json > /dev/null || { echo "ERROR: version not stamped"; exit 1; }

          mv manifest.pinned.json "$MANIFEST"
          jq '.modules[] | select(.name=="qk4")
              | {sources, version_env: .["build-options"].env.QK4_VERSION_FULL}' "$MANIFEST"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          manifest-path: flatpak/io.github.mikeg_dal.QK4.json
          bundle: QK4-${{ inputs.version }}-linux-x86_64.flatpak
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Verify build output
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # WHY inspect flatpak_app/ rather than the .flatpak: the bundle is a
          # compressed OSTree delta, so its size and contents can't be read
          # directly. flatpak_app/files is the tree that lands on a user's machine,
          # which is what actually needs checking.
          #
          # Note a Flatpak bundle is legitimately small — Qt comes from
          # org.kde.Platform, not from us — so size alone proves nothing here, the
          # way it does for the DMG and the Pi tarball.
          set -euo pipefail
          BUNDLE="QK4-${VERSION}-linux-x86_64.flatpak"
          TREE=flatpak_app/files
          FAIL=0

          test -f "$BUNDLE" || { echo "ERROR: bundle not produced: $BUNDLE"; exit 1; }
          echo "bundle size: $(stat -c%s "$BUNDLE") bytes"

          # The executable users launch, plus the desktop entry and icon that make
          # it appear in a launcher at all.
          for required in \
            "$TREE/bin/qk4" \
            "$TREE/share/applications/io.github.mikeg_dal.QK4.desktop" \
            "$TREE/share/icons/hicolor/512x512/apps/io.github.mikeg_dal.QK4.png"; do
            test -f "$required" || { echo "ERROR: missing from build tree: $required"; FAIL=1; }
          done

          # The version must have survived the jq stamping into the binary —
          # otherwise every Flatpak user sees the CMake fallback in Help/About.
          # grep -a scans raw bytes: no binutils dependency, and no guessing about
          # which ELF sections `strings` does or doesn't walk by default.
          if [ -f "$TREE/bin/qk4" ]; then
            if grep -aqF "$VERSION" "$TREE/bin/qk4"; then
              echo "version stamped: $VERSION"
            else
              echo "ERROR: version '$VERSION' not found in the built binary"
              echo "--- version-like strings actually present, for diagnosis ---"
              strings -a "$TREE/bin/qk4" 2>/dev/null \
                | grep -aE "^([0-9]+\.[0-9]+\.[0-9]+|development-|main-|dryrun-)" \
                | sort -u | head -10 || echo "(strings produced nothing)"
              FAIL=1
            fi
          fi

          exit $FAIL

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: QK4-${{ inputs.version }}-linux-x86_64.flatpak
          retention-days: ${{ inputs.retention-days }}
