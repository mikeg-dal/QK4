name: _build-windows

# Reusable Windows builder — the single definition of how the QK4 Windows bundle
# is assembled and verified. Called by build.yml and release.yml; never triggered
# directly.
#
# WHY the explicit TLS-backend copy below: windeployqt omits plugins/tls/
# qopensslbackend.dll when it cannot locate OpenSSL at deploy time, and Qt then
# falls back to Schannel, which has no TLS-PSK support at all. That shipped
# broken TLS on port 9204 between v0.7.0-beta.3 and 2026-08-02.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string stamped into the binary and the zip filename'
        required: true
        type: string
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 14
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve artifact name
        id: names
        shell: bash
        run: echo "artifact=QK4-windows-${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Cache vcpkg binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: vcpkg-bincache
          # Keyed on the manifest so a dependency or baseline bump rebuilds
          # instead of restoring stale binaries.
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-win-

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          # 6.11 pending: its restructured download repository isn't supported
          # by the installer tooling yet; bump when a release handles it.
          version: '6.10.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia qtshadertools qtserialport'
          cache: true

      - name: Setup vcpkg
        # Fetch first so the builtin-baseline commit in vcpkg.json is always
        # present even when the runner image's vcpkg checkout is older.
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          cd C:\vcpkg
          git fetch origin
          .\bootstrap-vcpkg.bat

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DQK4_VERSION_FULL="${{ inputs.version }}"

      - name: Build
        run: cmake --build build

      - name: Create release package
        run: |
          mkdir QK4-windows
          copy build\QK4.exe QK4-windows\

          windeployqt --release --no-translations --no-compiler-runtime QK4-windows\QK4.exe

          # WHY: windeployqt omits the OpenSSL TLS backend plugin when it cannot locate
          # OpenSSL at deploy time, and the vcpkg DLLs below are copied after it runs.
          # Without this plugin Qt silently falls back to Schannel, which has no TLS-PSK
          # support at all, so the K4's port-9204 PSK handshake can never complete.
          $qtPlugins = (& qmake -query QT_INSTALL_PLUGINS).Trim()
          $opensslBackend = Join-Path $qtPlugins "tls\qopensslbackend.dll"
          if (-not (Test-Path $opensslBackend)) {
            Write-Host "Qt OpenSSL TLS backend not found at $opensslBackend"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path QK4-windows\tls | Out-Null
          Copy-Item $opensslBackend QK4-windows\tls\ -Force

          # Bundle the MSVC runtime DLLs app-locally so users never install a
          # redistributable by hand. (windeployqt --compiler-runtime ships the
          # vc_redist installer instead, which defeats the purpose.)
          $crtDir = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC1*.CRT" | Select-Object -First 1
          Copy-Item "$($crtDir.FullName)\*.dll" QK4-windows\

          copy build\vcpkg_installed\x64-windows\bin\opus.dll QK4-windows\
          copy build\vcpkg_installed\x64-windows\bin\hidapi.dll QK4-windows\
          copy build\vcpkg_installed\x64-windows\bin\libssl-3-x64.dll QK4-windows\
          copy build\vcpkg_installed\x64-windows\bin\libcrypto-3-x64.dll QK4-windows\
          copy build\vcpkg_installed\x64-windows\bin\libusb-1.0.dll QK4-windows\

          $required = @(
            'QK4.exe',
            'vcruntime140*.dll',
            'libssl-3-x64.dll',
            'libcrypto-3-x64.dll',
            'tls\qopensslbackend.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path "QK4-windows\$_") }
          if ($missing) {
            Write-Host "Bundle incomplete - missing: $($missing -join ', ')"
            exit 1
          }

      # WHY upload the directory rather than a zip: actions/upload-artifact always
      # wraps the upload in its own zip. Uploading a zip therefore produces a
      # zip-inside-a-zip that testers must unwrap twice. Uploading the directory
      # gives a single unwrap. release.yml builds the named .zip release asset from
      # this artifact, so end users still download one self-contained file.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: QK4-windows/
          retention-days: ${{ inputs.retention-days }}
