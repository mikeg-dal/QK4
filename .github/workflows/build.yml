name: Build

run-name: >-
  ${{ github.event_name == 'push'
      && format('Build {0}', github.ref_name)
      || format('Build {0} (on demand)', github.ref_name) }}

# Packaging entry point for untagged builds. Produces the same signed, notarized,
# release-equivalent artifacts a tag would ship — on one run page, for all three
# platforms — without creating a GitHub Release or touching gh-pages.
#
# Automatic on push to main; on demand for any branch via workflow_dispatch.
# The actual per-platform logic lives in the _build-*.yml reusable workflows so
# there is exactly one definition of it, shared with release.yml.

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional suffix appended to "<branch>-<sha>" (e.g. "rc1"); leave blank for none.'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Derive version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Derive version
        id: derive
        run: |
          # Slashes are legal in ref names but not in filenames.
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${BRANCH}-${SHORT_SHA}"
          SUFFIX="${{ inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then
            VERSION="${VERSION}-${SUFFIX}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Derived version: $VERSION"

  macos:
    needs: version
    uses: ./.github/workflows/_build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/_build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  raspberry-pi:
    needs: version
    uses: ./.github/workflows/_build-pi.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  flatpak:
    needs: version
    uses: ./.github/workflows/_build-flatpak.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  summary:
    name: Artifact summary
    needs: [version, macos, windows, raspberry-pi, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "### QK4 build \`${{ needs.version.outputs.version }}\`"
            echo
            echo "| Platform | Artifact |"
            echo "|---|---|"
            echo "| macOS | \`${{ needs.macos.outputs.artifact-name }}\` |"
            echo "| Windows | \`${{ needs.windows.outputs.artifact-name }}\` |"
            echo "| Raspberry Pi | \`${{ needs.raspberry-pi.outputs.artifact-name }}\` |"
            echo "| Linux x86_64 | \`${{ needs.flatpak.outputs.artifact-name }}\` |"
            echo
            echo "Signed and notarized; equivalent to what a tag would ship."
            echo "No GitHub Release created, no gh-pages change."
          } >> "$GITHUB_STEP_SUMMARY"
