name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install clang-format
        # Pinned to an EXACT patch version, from PyPI's prebuilt LLVM binaries.
        #
        # WHY not apt. `clang-format-18` pins only the major, so the patch version moved with the
        # runner image while developers ran whatever their platform's 18.x was. clang-format's
        # line-breaking heuristics change between patch releases, so a file could be correctly
        # formatted locally and rejected here - with no way to reproduce the failure except by
        # guessing at the wrapping. The documented workaround was to hand-write long expressions as
        # one formatted string to avoid giving the two versions anything to disagree about, which
        # is a constraint on the source rather than a fix.
        #
        # The PyPI package ships the same upstream LLVM build for macOS and Linux, so this is
        # byte-identical to a developer's pinned 18.1.8: verified across every file in src/ and
        # tests/ against Homebrew's 18.1.8, zero differences.
        #
        # Bumping this requires a repo-wide reformat commit first, and the same version bump in
        # CLAUDE.md so local and CI never diverge again.
        run: pipx install clang-format==18.1.8

      - name: Check formatting
        run: |
          clang-format --version
          find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Qt 6 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-private-dev \
            qt6-multimedia-dev qt6-serialport-dev qt6-svg-dev \
            qt6-shadertools-dev \
            libopus-dev libhidapi-dev libusb-1.0-0-dev libssl-dev libudev-dev libasound2-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        # `qk4_tests` is a CMake aggregate target defined in tests/CMakeLists.txt
        # that depends on every test_* executable. Adding a new test only requires
        # an `add_executable(test_foo ...)` — no parallel edit to this workflow.
        # test_catserver remains the Phase 0.7 regression gate protecting the
        # RadioState public API contract used by the CAT server (see
        # docs/radiostate-catserver-api-contract.md).
        run: cmake --build build --target qk4_tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  sanitizer-tests:
    # Phase 0.10 — ASAN + UBSAN build of the test binaries, running on
    # every push. Originally added to guard the RadioState subsystem
    # split and MainWindow controller extraction against use-after-free
    # and UB that unit tests would otherwise miss. Post-refactor
    # (Phase 5.4) decision: keep it. Cost is one Ubuntu job + ~2 min;
    # it catches a bug class regular tests miss.
    # Scheduled deep runs (including TSan) live in sanitizers.yml.
    name: Sanitizer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Qt 6 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-private-dev \
            qt6-multimedia-dev qt6-serialport-dev qt6-svg-dev \
            qt6-shadertools-dev \
            libopus-dev libhidapi-dev libusb-1.0-0-dev libssl-dev libudev-dev libasound2-dev

      - name: Configure CMake (sanitizers on for tests)
        run: cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DQK4_TESTS_SANITIZE=ON

      - name: Build instrumented tests
        # See unit-tests job comment for why this uses the qk4_tests aggregate.
        run: cmake --build build-san --target qk4_tests

      - name: Run instrumented tests
        # UBSAN_OPTIONS=halt_on_error=1 makes CI fail fast on any UB detection.
        # ASAN is already set to abort via -fno-sanitize-recover=all in CMake.
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        run: ctest --test-dir build-san --output-on-failure
