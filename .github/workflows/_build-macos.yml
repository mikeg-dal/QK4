name: Reusable · macOS build

# Reusable macOS builder — the single definition of how a QK4 .app is assembled,
# signed, notarized, and packaged. Called by build-signed.yml, release.yml and
# ci-packaging.yml (the last with sign: false); never triggered directly (that is
# what the leading underscore signals).
#
# WHY this exists: this logic previously lived in three separate workflows. A fix
# had to be written three times, and build-macos.yml shipped a structurally broken
# bundle for six months while its two siblings were correct.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string stamped into the binary and the DMG filename'
        required: true
        type: string
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 14
      sign:
        description: 'Developer ID sign and notarize. False ad-hoc signs instead, for callers without the Apple secrets.'
        required: false
        type: boolean
        default: true
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build:
    # Pinned runner label (not macos-latest) so the Xcode/signing toolchain
    # only changes when we choose to move it.
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Names follow the same pattern as the other three builders. What tells a tester build from
      # the unsigned ci-packaging.yml one is the "-<version>-rcN" suffix build-signed.yml requires
      # on development, identical on every platform; no per-platform marker.
      - name: Resolve artifact name
        id: names
        run: |
          echo "artifact=QK4-macos-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=QK4-${{ inputs.version }}-macos.dmg" >> "$GITHUB_ENV"

      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < .github/qt-version)" >> "$GITHUB_ENV"

      # WHY the Qt Company's binary Qt and not Homebrew's: it is the Qt the Windows builder ships and
      # the maintainer develops against, pinned to one patch release. Homebrew's moved to whatever
      # was current (6.11.2 shipped while Windows shipped 6.10.3) and dragged in QtDBus, libdbus and
      # brotli that had to be copied and re-pointed by hand.
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia qtshadertools qtserialport'
          cache: true

      - name: Cache Homebrew downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/api
          key: brew-macos-${{ hashFiles('.github/workflows/_build-macos.yml') }}
          restore-keys: brew-macos-

      - name: Install dependencies
        run: brew install opus hidapi openssl@3 libusb

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      # WHY arm64 only: the Homebrew libraries QK4 links and bundles (OpenSSL, Opus, hidapi, libusb)
      # are arm64 only. A universal QK4 could not link them, and even with them linked the arm64
      # OpenSSL could never load on an Intel Mac, so Qt would fall back to Secure Transport, which
      # has no PSK cipher suites. scripts/macos-bundle.sh thins Qt's universal binaries to match.
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DQK4_VERSION_FULL="${{ inputs.version }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Create app bundle with dependencies
        run: scripts/macos-bundle.sh build/QK4.app "$QT_ROOT_DIR" "$(brew --prefix openssl@3)"

      - name: Import Code Signing Certificate
        if: inputs.sign
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign Application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN: ${{ inputs.sign }}
        run: |
          APP_BUNDLE="build/QK4.app"

          # WHY one step for both identities: an unsigned build must still walk the same
          # signing order, so the strict verify below judges the same bundle structure a
          # release ships. Ad-hoc ("-") is the only identity available without the secrets,
          # which a pull request from a fork never receives.
          #
          # The hardened runtime is dropped with the identity: notarization is what requires it, and
          # with it an ad-hoc bundle can be refused its own ad-hoc-signed frameworks by library
          # validation, so the DMG would verify here and then fail to launch for anyone who tried it.
          if [ "$SIGN" = "true" ]; then
            IDENTITY="Developer ID Application: Michael Richard Garcia ($APPLE_TEAM_ID)"
            RUNTIME=(--options runtime)
          else
            IDENTITY="-"
            RUNTIME=()
          fi

          echo "=== Signing frameworks and libraries ==="
          find "$APP_BUNDLE/Contents/Frameworks" -name "*.dylib" -exec \
            codesign --force "${RUNTIME[@]}" --sign "$IDENTITY" {} \;

          find "$APP_BUNDLE/Contents/Frameworks" -name "*.framework" -exec \
            codesign --force "${RUNTIME[@]}" --sign "$IDENTITY" {} \;

          echo "=== Signing PlugIns ==="
          find "$APP_BUNDLE/Contents/PlugIns" -name "*.dylib" -exec \
            codesign --force "${RUNTIME[@]}" --sign "$IDENTITY" {} \;

          echo "=== Signing main application with entitlements ==="
          codesign --force "${RUNTIME[@]}" \
            --entitlements "resources/QK4.entitlements" \
            --sign "$IDENTITY" \
            "$APP_BUNDLE"

          codesign --verify --verbose=2 "$APP_BUNDLE"
          if [ "$SIGN" = "true" ]; then
            spctl --assess --type execute --verbose "$APP_BUNDLE" || echo "Note: spctl may fail before notarization"
          fi

      - name: Create DMG
        run: |
          APP_BUNDLE="build/QK4.app"

          echo "=== Creating DMG staging directory ==="
          mkdir -p dmg-staging
          ditto "$APP_BUNDLE" dmg-staging/QK4.app
          ln -s /Applications dmg-staging/Applications

          sync
          touch dmg-staging/.metadata_never_index
          sleep 5

          echo "=== Creating DMG ==="
          for attempt in 1 2 3; do
            if hdiutil create -volname "QK4" \
              -srcfolder dmg-staging \
              -ov -format UDZO \
              -nocrossdev \
              "QK4-staging.dmg"; then
              break
            fi
            echo "hdiutil attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          test -f "QK4-staging.dmg" || { echo "DMG creation failed after 3 attempts"; exit 1; }
          mv "QK4-staging.dmg" "$DMG_NAME"
          rm -rf dmg-staging
          ls -lh "$DMG_NAME"

      - name: Sign and Notarize DMG
        if: inputs.sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |

          echo "=== Signing DMG ==="
          codesign --force --sign "Developer ID Application: Michael Richard Garcia ($APPLE_TEAM_ID)" \
            "$DMG_NAME"

          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8

          echo "=== Submitting DMG for notarization ==="
          xcrun notarytool submit "$DMG_NAME" \
            --key ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 30m

          echo "=== Stapling notarization ticket to DMG ==="
          xcrun stapler staple "$DMG_NAME"

          xcrun stapler validate "$DMG_NAME"
          spctl --assess --type open --context context:primary-signature "$DMG_NAME" || echo "spctl check completed"

          rm -rf ~/private_keys

      - name: Verify DMG contents
        env:
          SIGN: ${{ inputs.sign }}
        run: |
          # WHY: this must inspect the *packaged* artifact, not build/QK4.app. Symlink
          # flattening happens during packaging, so a gate on the build tree passes even
          # when the shipped bundle is broken. The script also runs the packaged app's
          # --tls-self-check and requires libssl to load from inside the bundle.
          hdiutil attach "$DMG_NAME" -nobrowse -quiet -mountpoint ./verify-mnt
          STATUS=0
          scripts/macos-verify-bundle.sh ./verify-mnt/QK4.app || STATUS=$?

          # WHY a separate signed gate: the bundle checks above pass on an ad-hoc build too, so on
          # their own they cannot tell a tester DMG from the unsigned CI one. A signed build must
          # carry a Developer ID signature with the hardened runtime on the app, a Developer ID
          # signature on the DMG and a stapled notarization ticket, or the run fails.
          if [ "$SIGN" = "true" ]; then
            echo "=== Signed build: Developer ID and notarization ==="
            APP_SIG=$(codesign -dvv ./verify-mnt/QK4.app 2>&1)
            echo "$APP_SIG" | grep -q '^Authority=Developer ID Application:' \
              || { echo "ERROR: app is not Developer ID signed"; STATUS=1; }
            echo "$APP_SIG" | grep -q '^CodeDirectory .*flags=.*runtime' \
              || { echo "ERROR: app lacks the hardened runtime"; STATUS=1; }
            codesign -dvv "$DMG_NAME" 2>&1 | grep -q '^Authority=Developer ID Application:' \
              || { echo "ERROR: DMG is not Developer ID signed"; STATUS=1; }
            xcrun stapler validate "$DMG_NAME" \
              || { echo "ERROR: DMG has no stapled notarization ticket"; STATUS=1; }
          fi

          hdiutil detach ./verify-mnt -quiet
          exit $STATUS

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ env.DMG_NAME }}
          retention-days: ${{ inputs.retention-days }}
